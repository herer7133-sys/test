version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: geocontrol-db
    environment:
      POSTGRES_USER: geocontrol
      POSTGRES_PASSWORD: secure_password_change_me
      POSTGRES_DB: geocontrol_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geocontrol"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Broker
  redis:
    image: redis:7-alpine
    container_name: geocontrol-redis
    command: redis-server --requirepass secure_redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Object Storage (S3 compatible)
  minio:
    image: minio/minio:latest
    container_name: geocontrol-minio
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: secure_minio_password
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # NestJS Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geocontrol-backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://geocontrol:secure_password_change_me@postgres:5432/geocontrol_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: secure_redis_password
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio_admin
      MINIO_SECRET_KEY: secure_minio_password
      JWT_SECRET: super_secret_jwt_key_change_me
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run start:dev

  # FastAPI ML Service
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: geocontrol-ml
    environment:
      PYTHONUNBUFFERED: 1
      MODEL_PATH: /app/models
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8000:8000"
    depends_on:
      - redis
    volumes:
      - ./ml-service:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend (Vite) - Optional for dev, usually built separately
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: geocontrol-frontend
  #   environment:
  #     VITE_API_URL: http://localhost:3000
  #   ports:
  #     - "5173:5173"
  #   depends_on:
  #     - backend
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #   command: npm run dev -- --host

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  default:
    name: geocontrol-network
